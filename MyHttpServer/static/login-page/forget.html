<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forget Form</title>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet"
          type="text/css"
          href="/connection/login-page/style.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6 col-md-6 d-none d-md-block image-container"></div>

        <div class="col-lg-6 col-md-6 form-container">
            <div class="col-lg-8 col-md-12 col-sm-9 col-xs-12 form-box">
                <div class="text-center logo mb-3">
                    <img src="/connection/login-page/image/logo.png"
                         width="150"
                         alt="Logo">
                </div>

                <div id="reset-form">
                    <form id="reset-password-form"
                          onsubmit="return showResetMessage(event);">

                        <h4 class="mb-3">Reset your password</h4>

                        <p class="mb-3 text-white">
                            Please enter your email address
                        </p>

                        <div class="form-input">
                                <span>
                                    <i class="fa fa-envelope" aria-hidden="true"></i>
                                </span>

                            <input type="email"
                                   placeholder="Email Address"
                                   aria-label="Email Address"
                                   required>
                        </div>

                        <div class="mb-3">
                            <button class="btn" type="submit">
                                Send Reset link
                            </button>
                        </div>

                        <p class="text-white">
                            Учебный макет. Отправка писем не подключена.
                        </p>

                        <a href="/connection/auth/login"
                           class="login-link">
                            Back to Login
                        </a>
                    </form>
                </div>

                <div id="reset-confirmation" hidden>
                    <div class="mb-4">
                        <h4 class="mb-3">
                            Demo only
                        </h4>

                        <p class="text-white" role="status">
                            Восстановление пароля пока не реализовано.
                            Данные не отправлены, письмо не отправлено.
                        </p>
                    </div>

                    <a href="/connection/auth/login"
                       class="btn btn-light">
                        Login Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function showResetMessage(event) {
        event.preventDefault();

        document.getElementById('reset-form').hidden = true;
        document.getElementById('reset-confirmation').hidden = false;

        return false;
    }
</script>
</body>
</html>
