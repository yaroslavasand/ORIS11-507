<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rockstar Games — Sign In</title>
    <style>
        :root {
            --yellow: #ffb51a;
            --text: #505050;
            --border: #dedede;
            --focus: #0785d1;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #050505;
            background-image:
                    radial-gradient(circle at 18% 12%, rgba(255,255,255,.034) 0 1px, transparent 2px),
                    radial-gradient(circle at 73% 31%, rgba(255,255,255,.027) 0 1px, transparent 2px),
                    linear-gradient(25deg, transparent 48%, rgba(255,255,255,.035) 49% 51%, transparent 52%),
                    linear-gradient(-25deg, transparent 48%, rgba(255,255,255,.035) 49% 51%, transparent 52%);
            background-size: 110px 110px, 126px 126px, 95px 95px, 95px 95px;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 84px 20px 25px;
        }

        .logo {
            display: block;
            width: 145px;
            height: 139px;
            margin-bottom: 44px;
            object-fit: contain;
            user-select: none;
        }

        .panel {
            width: min(716px, 100%);
            padding: 30px;
            background: #fff;
            border-radius: 3px;
        }

        h1 {
            margin: 0 0 32px;
            color: var(--text);
            font-size: 35px;
            font-weight: 700;
            line-height: 1;
        }

        .field { margin-bottom: 29px; }
        .input-wrap { position: relative; }

        input[type="email"], input[type="password"], input[type="text"] {
            display: block;
            width: 100%;
            height: 71px;
            padding: 0 27px;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #222;
            background: #fff;
            font: inherit;
            font-size: 24px;
            outline: none;
        }

        input::placeholder { color: #555; opacity: 1; }
        input:focus { border: 3px solid var(--focus); padding-left: 25px; }
        .password { padding-right: 78px !important; }

        .password-toggle {
            position: absolute;
            z-index: 2;
            top: 50%;
            right: 21px;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #9d9d9d;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .password-toggle svg { display: block; width: 20px; height: 20px; fill: currentColor; }
        .password-toggle .icon-visible { display: none; }
        .password-toggle.is-visible .icon-visible { display: block; }
        .password-toggle.is-visible .icon-hidden { display: none; }
        .password-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .password-toggle:hover .tooltip, .password-toggle:focus .tooltip { opacity: 1; visibility: visible; }

        .tooltip {
            position: absolute;
            right: 57px;
            top: 50%;
            width: 212px;
            padding: 23px 18px;
            transform: translateY(-50%);
            border-radius: 4px;
            background: #1c1c1c;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .12s ease;
            white-space: nowrap;
        }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 50%;
            right: -12px;
            width: 0;
            height: 0;
            margin-top: -10px;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 12px solid #1c1c1c;
        }

        .controls { margin-top: -1px; }

        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            font-size: 24px;
            cursor: pointer;
        }

        .check-label input {
            appearance: none;
            width: 29px;
            height: 29px;
            margin: 0;
            border: 2px solid #222;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        .check-label input:checked {
            background: var(--yellow);
            box-shadow: inset 0 0 0 5px #fff;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
        }

        .forgot {
            color: #202020;
            font-size: 23px;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }

        .sign-in {
            width: 143px;
            height: 55px;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: var(--yellow);
            color: #090909;
            font-size: 23px;
            font-weight: 700;
            cursor: pointer;
        }

        .sign-in:hover { filter: brightness(.96); }

        .providers {
            width: min(716px, 100%);
            min-height: 151px;
            display: flex;
            align-items: center;
            margin-top: 29px;
            padding: 28px 30px;
            border-radius: 3px;
            background: #fff;
        }

        .providers-title { flex: 1; color: #505050; font-size: 24px; }
        .provider-icons { display: flex; align-items: center; gap: 16px; }

        .provider {
            display: grid;
            width: 94px;
            height: 94px;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }

        .provider img { display: block; width: 94px; height: 94px; }

        .create-line {
            margin: 41px 0 0;
            color: #fff;
            font-size: 22px;
            text-align: center;
        }

        .create-line a { color: var(--yellow); }

        footer {
            margin-top: auto;
            padding-top: 77px;
            color: #a4a4a4;
            font-size: 17px;
            text-align: center;
        }

        footer a { color: #d5d5d5; text-decoration: none; }
        .sep { margin: 0 5px; color: #d5d5d5; }

        @media (max-width: 600px) {
            .page { padding: 41px 14px 20px; }
            .logo { width: 112px; height: 114px; margin-bottom: 12px; }
            .panel { padding: 28px; }
            h1 { font-size: 34px; }
            .check-label { font-size: 22px; }
            .forgot { font-size: 20px; }
            .providers { padding: 27px 28px; }
            .providers-title { font-size: 23px; }
            .provider, .provider img { width: 75px; height: 75px; }
            .provider-icons { gap: 12px; }
            footer { padding-top: 65px; font-size: 14px; }
        }

        @media (max-width: 430px) {
            .bottom-row { gap: 16px; }
            .tooltip { right: 48px; width: 175px; font-size: 14px; white-space: normal; }
            .providers { flex-wrap: wrap; gap: 16px; }
            .providers-title { flex-basis: 100%; }
            .create-line { font-size: 19px; }
        }
    </style>
</head>
<body>
<main class="page">
    <img class="logo" src="https://s.rsg.sc/auth/images/logo_20231030.svg" alt="Rockstar Games">

    <section class="panel" aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">Sign In</h1>
        <form onsubmit="return false;">
            <div class="field">
                <input id="email" type="email" placeholder="Email" autofocus>
            </div>

            <div class="field">
                <div class="input-wrap">
                    <input id="password" class="password" type="password" placeholder="Password">
                    <button id="passwordToggle" class="password-toggle" type="button" aria-label="Reveal password" aria-pressed="false">
                        <!--пароль скрыт -->
                        <svg class="icon-hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true"><path d="M3.1 2.2 29.8 28.9l-1.8 1.8-4.8-4.8A17.3 17.3 0 0 1 16 27.4C8.7 27.4 3.1 23.1.5 18.5a5 5 0 0 1 0-5C1.7 11.4 3.5 9.6 5.6 8.2L1.3 4zm4.4 7.9a15.6 15.6 0 0 0-4.6 4.7 2.5 2.5 0 0 0 0 2.5c2.2 3.8 6.9 7.6 13.1 7.6 1.9 0 3.7-.3 5.3-.9l-3.2-3.2a6.8 6.8 0 0 1-8.9-8.9zm8.5-5.5c7.3 0 12.9 4.3 15.5 8.9a5 5 0 0 1 0 5 20 20 0 0 1-4.8 5.5l-1.8-1.8a17 17 0 0 0 4.3-4.9 2.5 2.5 0 0 0 0-2.5C27.1 11 22.2 7.1 16 7.1c-.9 0-1.9.1-2.8.3l-2.1-2.1a19 19 0 0 1 4.9-.7zm0 4.6a6.8 6.8 0 0 1 6.8 6.8c0 .8-.1 1.5-.4 2.2L13.8 9.6c.7-.3 1.4-.4 2.2-.4zm-4.2 4.2 6.8 6.8a4.3 4.3 0 0 0-6.8-6.8z"/></svg>
                        <!--пароль виден -->
                        <svg class="icon-visible UI__Icon__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="16" width="16" data-ui-name="visibility_on_icon" aria-hidden="true" id="ui-icon-visibility_on-60"><path d="M30.6 14.7c-.3 0-.6-.1-.8-.3C21.5 8 10.5 8 2.2 14.4c-.6.5-1.5.4-1.9-.2-.5-.6-.4-1.5.2-1.9 9.3-7.2 21.7-7.2 30.9 0 .6.5.7 1.3.2 1.9-.2.3-.6.5-1 .5zM16 25.2c-5.4 0-10.8-1.8-15.5-5.4-.6-.5-.7-1.3-.2-1.9.5-.6 1.3-.7 1.9-.2 8.2 6.4 19.3 6.4 27.6 0 .6-.5 1.5-.4 1.9.2.5.6.4 1.5-.2 1.9-4.7 3.6-10.1 5.4-15.5 5.4z"></path><g><path d="M16 21.1c-.5 0-1-.1-1.5-.2-.7-.2-1.1-1-.9-1.7.2-.7 1-1.1 1.7-.9.8.3 1.7 0 2.3-.6.9-.9.9-2.4 0-3.3-.9-.9-2.4-.9-3.3 0-.4.4-.6.9-.7 1.5 0 .8-.7 1.3-1.4 1.3-.8 0-1.3-.7-1.3-1.4.1-1.2.6-2.4 1.5-3.3 2-2 5.2-2 7.2 0s2 5.2 0 7.2c-1 .9-2.3 1.4-3.6 1.4z"></path></g></svg>
                        <span class="tooltip" role="tooltip">Reveal password</span>
                    </button>
                </div>
            </div>

            <div class="controls">
                <label class="check-label">
                    <input type="checkbox">
                    <span>Keep me signed in</span>
                </label>
            </div>

            <div class="bottom-row">
                <a class="forgot" href="#">Forgot your password?</a>
                <button class="sign-in" type="submit">Sign in</button>
            </div>
        </form>
    </section>

    <section class="providers" aria-label="Sign in using">
        <span class="providers-title">Sign in using</span>
        <div class="provider-icons">
            <button class="provider" type="button" aria-label="Sign in with PlayStation">
                <img src="https://s.rsg.sc/auth/images/icons/colored/np.svg" alt="PlayStation">
            </button>
            <button class="provider" type="button" aria-label="Sign in with Xbox">
                <img src="https://s.rsg.sc/auth/images/icons/colored/xbl.svg" alt="Xbox">
            </button>
        </div>
    </section>

    <p class="create-line">Don't have a Rockstar Games account? <a href="#">Create a new account</a></p>

    <footer>
        © 2026 ROCKSTAR GAMES<span class="sep">|</span><a href="#">PRIVACY POLICY</a><span class="sep">|</span><a href="#">TERMS OF SERVICE</a><span class="sep">|</span><a href="#">COOKIE SETTINGS</a>
    </footer>
</main>

<script>
    const password = document.getElementById('password');
    const toggle = document.getElementById('passwordToggle');
    const tooltip = toggle.querySelector('.tooltip');

    toggle.addEventListener('click', () => {
        const show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        toggle.classList.toggle('is-visible', show);
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Reveal password');
        tooltip.textContent = show ? 'Hide password' : 'Reveal password';
    });
</script>
</body>
</html>
