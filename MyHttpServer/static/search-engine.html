<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            color: #222222;
            font-family: Arial, sans-serif;
        }

        .page {
            position: relative;
            min-height: 100vh;
        }

       
        .weather {
            position: absolute;
            top: 16px;
            right: 18px;
            text-align: right;
        }

        .temperature {
            font-size: 25px;
            font-weight: 700;
            line-height: 1;
        }

        .city {
            margin-top: 8px;
            color: #7470d8;
            font-size: 14px;
            font-weight: 700;
        }

    
        .content {
            position: absolute;
            top: 34%;
            left: 50%;
            width: 512px;
            max-width: calc(100% - 40px);
            transform: translateX(-50%);
            text-align: center;
        }

        .clock {
            margin: 0;
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 1px;
        }

        .greeting {
            margin: 27px 0 49px;
            color: #7470d8;
            font-size: 26px;
            font-weight: 700;
        }

       
        .search {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            height: 55px;
            padding: 0 22px;
            border: 1px solid #eeeeee;
            border-radius: 16px;
            background: #fcfcfc;
            text-align: left;
        }

        .search-icon {
            position: relative;
            display: block;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            border: 1.5px solid #bdbdbd;
            border-radius: 50%;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            right: -5px;
            bottom: -2px;
            width: 7px;
            height: 1.5px;
            background: #bdbdbd;
            transform: rotate(45deg);
        }

        .search-text {
            color: #a0a0a0;
            font-size: 17px;
        }

   
        .shortcuts {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-top: 46px;
        }

        .shortcuts img {
            display: block;
            width: 55px;
            height: 55px;
            flex: 0 0 55px;
            object-fit: contain;
        }

       
        .add-shortcut {
            position: relative;
            width: 55px;
            height: 55px;
            flex: 0 0 55px;
            border: 1px solid #eeeeee;
            border-radius: 16px;
            background: #fcfcfc;
        }

        .add-shortcut::before,
        .add-shortcut::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            background: #b7b7b7;
            transform: translate(-50%, -50%);
        }

        .add-shortcut::before {
            width: 18px;
            height: 1px;
        }

        .add-shortcut::after {
            width: 1px;
            height: 18px;
        }

        
        @media (max-width: 600px) {
            .weather {
                top: 28px;
                right: 28px;
            }

            .temperature {
                font-size: 26px;
            }

            .city {
                font-size: 15px;
            }

            .content {
                top: 36%;
                width: calc(100% - 62px);
                max-width: 480px;
            }

            .clock {
                font-size: clamp(42px, 10.3vw, 54px);
            }

            .greeting {
                margin: 29px 0 0;
                font-size: clamp(21px, 5vw, 26px);
            }

            .search {
                height: 78px;
                margin-top: 292px;
                padding: 0 34px;
                gap: 18px;
                border-radius: 19px;
            }

            .search-icon {
                width: 24px;
                height: 24px;
                flex-basis: 24px;
            }

            .search-icon::after {
                right: -6px;
                bottom: -3px;
                width: 9px;
            }

            .search-text {
                font-size: 24px;
            }

            .shortcuts {
                justify-content: space-between;
                gap: 10px;
                margin-top: 33px;
            }

            .shortcuts img {
                width: min(66px, 15%);
                height: auto;
                flex: 0 1 auto;
            }

        
            .shortcuts img:nth-child(n+6),
            .add-shortcut {
                display: none;
            }
        }

        
        @media (max-width: 600px) and (max-height: 800px) {
            .content {
                top: 30%;
            }

            .search {
                margin-top: 160px;
            }
        }
    </style>
</head>

<body>
<main class="page">

    <div class="weather">
        <div class="temperature">36°</div>
        <div class="city">Ahmedabad</div>
    </div>

    <section class="content">
        <h1 class="clock">09:11:01</h1>
        <p class="greeting">Good Morning, Saad.</p>

        <div class="search">
            <span class="search-icon" aria-hidden="true"></span>
            <span class="search-text">Search</span>
        </div>

        <div class="shortcuts">
            <img src="images/Frame 1261155605.svg" alt="">
            <img src="images/Frame 1261155604.svg" alt="">
            <img src="images/Frame 1261155606.svg" alt="">
            <img src="images/Frame 1261155602.svg" alt="">
            <img src="images/Frame 1261155607.svg" alt="">
            <img src="images/Frame 1261155601.svg" alt="">
            <span class="add-shortcut" aria-hidden="true"></span>
        </div>
    </section>

</main>
</body>
</html>
